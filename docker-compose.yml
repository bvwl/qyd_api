# QYD 应用栈：API + Queue Worker + 日志压缩 + Frontend + Nginx
# MySQL 与 Redis 均使用外部已部署服务，本文件不会创建数据库或 Redis 容器。
# 仅修改本文件不会影响正在运行的容器；发布前先执行：
# docker compose --env-file .env config --quiet

x-backend-environment: &backend-environment
  TZ: Asia/Shanghai

  # MySQL 主库
  DB_HOST: "${DB_HOST:-host.docker.internal}"
  DB_PORT: "${DB_PORT:-3306}"
  DB_USER: "${DB_USER:-qyd}"
  DB_PASSWORD: "${DB_PASSWORD:?请在 .env 中配置 DB_PASSWORD}"
  DB_NAME: "${DB_NAME:-qyd}"
  DB_MINSIZE: "${DB_MINSIZE:-5}"
  DB_MAXSIZE: "${DB_MAXSIZE:-20}"
  DB_ECHO: "${DB_ECHO:-0}"
  DB_POOL_RECYCLE: "${DB_POOL_RECYCLE:-3600}"
  DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-10}"

  # MySQL 读写分离
  DB_READ_WRITE_SPLIT: "${DB_READ_WRITE_SPLIT:-0}"
  DB_SLAVE1_HOST: "${DB_SLAVE1_HOST:-}"
  DB_SLAVE1_PORT: "${DB_SLAVE1_PORT:-3306}"
  DB_SLAVE1_USER: "${DB_SLAVE1_USER:-${DB_USER:-qyd}}"
  DB_SLAVE1_PASSWORD: "${DB_SLAVE1_PASSWORD:-${DB_PASSWORD}}"
  DB_SLAVE1_NAME: "${DB_SLAVE1_NAME:-${DB_NAME:-qyd}}"
  DB_SLAVE1_MINSIZE: "${DB_SLAVE1_MINSIZE:-5}"
  DB_SLAVE1_MAXSIZE: "${DB_SLAVE1_MAXSIZE:-20}"
  DB_SLAVE2_HOST: "${DB_SLAVE2_HOST:-}"
  DB_SLAVE2_PORT: "${DB_SLAVE2_PORT:-3306}"
  DB_SLAVE2_USER: "${DB_SLAVE2_USER:-${DB_USER:-qyd}}"
  DB_SLAVE2_PASSWORD: "${DB_SLAVE2_PASSWORD:-${DB_PASSWORD}}"
  DB_SLAVE2_NAME: "${DB_SLAVE2_NAME:-${DB_NAME:-qyd}}"
  DB_SLAVE2_MINSIZE: "${DB_SLAVE2_MINSIZE:-5}"
  DB_SLAVE2_MAXSIZE: "${DB_SLAVE2_MAXSIZE:-20}"

  # 外部 Redis
  REDIS_ENABLED: "${REDIS_ENABLED:-1}"
  REDIS_HOST: "${REDIS_HOST:-host.docker.internal}"
  REDIS_PORT: "${REDIS_PORT:-6379}"
  REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 .env 中配置 REDIS_PASSWORD}"
  REDIS_DB: "${REDIS_DB:-0}"
  REDIS_MAX_CONNECTIONS: "${REDIS_MAX_CONNECTIONS:-50}"
  REDIS_TIMEOUT: "${REDIS_TIMEOUT:-5}"
  REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-qyd:}"

  # 队列
  REDIS_QUEUE_BATCH_SIZE: "${REDIS_QUEUE_BATCH_SIZE:-200}"
  REDIS_QUEUE_NUM_WORKERS: "${REDIS_QUEUE_NUM_WORKERS:-4}"
  REDIS_QUEUE_CACHE_EXPIRE: "${REDIS_QUEUE_CACHE_EXPIRE:-3600}"

  # JWT 与日志
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?请在 .env 中配置 JWT_SECRET_KEY}"
  JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
  LOG_LEVEL: "${LOG_LEVEL:-WARNING}"
  LOG_ENABLE_CONSOLE: "${LOG_ENABLE_CONSOLE:-1}"
  LOG_ENABLE_FILE: "${LOG_ENABLE_FILE:-1}"
  LOG_CONSOLE_LEVEL: "${LOG_CONSOLE_LEVEL:-WARNING}"
  LOG_FILE_LEVEL: "${LOG_FILE_LEVEL:-${LOG_LEVEL:-INFO}}"
  LOG_MAX_BYTES: "${LOG_MAX_BYTES:-20971520}"
  LOG_BACKUP_COUNT: "${LOG_BACKUP_COUNT:-9}"
  LOG_MAX_MESSAGE_LENGTH: "${LOG_MAX_MESSAGE_LENGTH:-8192}"
  LOG_MAX_VALUE_LENGTH: "${LOG_MAX_VALUE_LENGTH:-1024}"
  API_LOG_SUCCESS_SAMPLE_RATE: "${API_LOG_SUCCESS_SAMPLE_RATE:-0.01}"
  API_LOG_CLIENT_ERROR_SAMPLE_RATE: "${API_LOG_CLIENT_ERROR_SAMPLE_RATE:-0.1}"
  API_LOG_SLOW_SECONDS: "${API_LOG_SLOW_SECONDS:-3}"
  API_LOG_SKIP_PATHS: "${API_LOG_SKIP_PATHS:-/health,/api/health}"
  UVICORN_ACCESS_LOG: "${UVICORN_ACCESS_LOG:-0}"
  ERROR_TRACKER_MAX_ENTRIES: "${ERROR_TRACKER_MAX_ENTRIES:-2048}"
  LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"

x-backend-volumes: &backend-volumes
  - ./backend/logs:/app/logs
  - ./backend/status:/app/status
  - ./backend/static:/app/static
  - ./backend/backups:/app/backups

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    compress: "true"

services:
  backend-api:
    build:
      context: ./backend
      target: backend-api
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend-environment
      APP_HOST: 0.0.0.0
      APP_PORT: "6080"
      APP_DEBUG: "${APP_DEBUG:-0}"
      WORKERS: "${WORKERS:-1}"
      APP_LIMIT_CONCURRENCY: "${APP_LIMIT_CONCURRENCY:-1000}"
      APP_BACKLOG: "${APP_BACKLOG:-1024}"
      APP_TIMEOUT_KEEP_ALIVE: "${APP_TIMEOUT_KEEP_ALIVE:-5}"
      ENABLE_QUEUE_WORKERS: "0"
      ENABLE_DOCS: "${ENABLE_DOCS:-1}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost}"
      JWT_EXPIRE_TIME: "${JWT_EXPIRE_TIME:-86400}"
      DB_CHECK_INTERVAL_MINUTES: "${DB_CHECK_INTERVAL_MINUTES:-30}"
      ENABLE_EMAIL_CHECK: "${ENABLE_EMAIL_CHECK:-0}"
      EMAIL_CHECK_INTERVAL_HOURS: "${EMAIL_CHECK_INTERVAL_HOURS:-1}"
      ENABLE_STATS_SYNC: "${ENABLE_STATS_SYNC:-1}"
      STATS_SYNC_INTERVAL_MINUTES: "${STATS_SYNC_INTERVAL_MINUTES:-60}"
      SHUTDOWN_WAIT_SECONDS: "${SHUTDOWN_WAIT_SECONDS:-0.5}"
    volumes: *backend-volumes
    networks:
      - qyd-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s = socket.create_connection(('127.0.0.1', 6080), 5); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    logging: *default-logging

  queue-worker:
    build:
      context: ./backend
      target: queue-worker
    restart: unless-stopped
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend-environment
      QUEUE_WORKER_PROCESSES: "${QUEUE_WORKER_PROCESSES:-1}"
    volumes: *backend-volumes
    networks:
      - qyd-network
    stop_grace_period: 60s
    logging: *default-logging

  log-compressor:
    build:
      context: ./backend
      target: log-compressor
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: "${LOG_LEVEL:-WARNING}"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
      LOG_COMPRESS_INTERVAL_HOURS: "${LOG_COMPRESS_INTERVAL_HOURS:-2}"
      LOG_COMPRESS_ON_STARTUP: "${LOG_COMPRESS_ON_STARTUP:-1}"
      LOG_COMPRESS_MIN_AGE_SECONDS: "${LOG_COMPRESS_MIN_AGE_SECONDS:-300}"
      LOG_COMPRESS_LEVEL: "${LOG_COMPRESS_LEVEL:-3}"
    volumes:
      - ./backend/logs:/app/logs
    stop_grace_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://192.168.13.6:6080}"
        VITE_APP_TITLE: "${VITE_APP_TITLE:-QYD项目管理系统}"
    restart: unless-stopped
    init: true
    networks:
      - qyd-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend-api:
        condition: service_healthy
    stop_grace_period: 15s
    logging: *default-logging

  nginx-lb:
    image: nginx:alpine
    container_name: qyd-nginx-lb
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-6080}:6080"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - qyd-network
    depends_on:
      frontend:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    logging: *default-logging

networks:
  qyd-network:
    driver: bridge

volumes:
  nginx-logs:
    driver: local
