[pytest]
# pytest 配置文件

# 测试文件搜索模式
python_files = test_*.py *_test.py

# 测试类搜索模式
python_classes = Test*

# 测试函数搜索模式
python_functions = test_*

# 测试目录
testpaths = app/tests

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记定义
markers =
    server: 服务器相关接口测试
    mail: 邮箱相关接口测试
    project: 项目相关接口测试
    user: 用户相关接口测试
    slow: 标记慢速测试
    integration: 集成测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
