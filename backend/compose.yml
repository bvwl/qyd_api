# 后端单容器开发/兼容配置。
# 生产环境优先使用仓库根目录的 docker-compose.yml 或 docker-compose.backend.yml。

services:
  qyd_api:
    container_name: qyd_api
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-api
    command: ["python", "start.py"]
    working_dir: /app
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      APP_HOST: 0.0.0.0
      APP_PORT: "6080"
      APP_DEBUG: "${APP_DEBUG:-0}"
      WORKERS: "${WORKERS:-1}"
      ENABLE_QUEUE_WORKERS: "${ENABLE_QUEUE_WORKERS:-0}"
    volumes:
      - .:/app
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-6080}:6080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s = socket.create_connection(('127.0.0.1', 6080), 5); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
        compress: "true"
