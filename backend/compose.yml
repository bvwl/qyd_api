services:
  # 容器服务名称
  qyd_api:
    # 容器名称
    container_name: qyd_api
    build:
      # 在当前目录下寻找Dockerfile文件并构建镜像
      context: .
      dockerfile: Dockerfile
    # 重启策略
    restart: always
    # 挂载目录 本地化容器数据
    # 这里挂载了本地当前目录的app目录到容器的/app目录
    volumes:
      - .:/app
    # 环境变量 可以在Dockerfile中配置环境变量，应用中获取
    environment:
      - NAME=qyd_api
      - TZ=Asia/Shanghai
    # 端口映射 容器端口映射到主机端口
    ports:
      - "6080:6080"
    # 日志配置 - 限制日志大小并启用日志轮转
    logging:
      driver: "json-file"
      options:
        max-size: "10m"        # 单个日志文件最大10MB
        max-file: "3"          # 保留最多3个日志文件
        compress: "true"       # 压缩旧日志文件
