# ==========================================
# Nginx 负载均衡配置（生产环境）
# ==========================================

# 后端 API 负载均衡池
# 注意：Docker Compose 会自动进行 DNS 轮询负载均衡
# 直接使用服务名 backend-api，Docker 会自动解析到所有容器
upstream backend_api {
    # 使用服务名，Docker Compose 会自动负载均衡到所有副本
    server backend-api:6080 max_fails=3 fail_timeout=30s;
    
    # 保持连接
    keepalive 100;
}

# HTTP 服务器
server {
    listen 80;
    server_name _;
    
    # 访问日志
    access_log /var/log/nginx/qyd_access.log;
    error_log /var/log/nginx/qyd_error.log;
    
    # 客户端最大请求体大小
    client_max_body_size 100M;
    
    # 前端静态文件
    location / {
        # 使用服务名，Docker Compose 会自动解析
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 后端 API 服务器
server {
    listen 6080;
    server_name _;
    
    # 访问日志
    access_log /var/log/nginx/qyd_api_access.log;
    error_log /var/log/nginx/qyd_api_error.log;
    
    # 客户端最大请求体大小
    client_max_body_size 100M;
    
    # 后端 API（负载均衡）
    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
