# ==========================================
# Nginx 负载均衡配置（生产环境）
# ==========================================

# 后端 API 负载均衡池
upstream backend_api {
    # 负载均衡策略：least_conn（最少连接）
    least_conn;
    
    # 5 个后端容器（通过容器名访问）
    server qyd_api-backend-api-1:6080 max_fails=3 fail_timeout=30s;
    server qyd_api-backend-api-2:6080 max_fails=3 fail_timeout=30s;
    server qyd_api-backend-api-3:6080 max_fails=3 fail_timeout=30s;
    server qyd_api-backend-api-4:6080 max_fails=3 fail_timeout=30s;
    server qyd_api-backend-api-5:6080 max_fails=3 fail_timeout=30s;
    
    # 保持连接
    keepalive 100;
}

# HTTP 服务器
server {
    listen 80;
    server_name 192.168.13.6;
    
    # 访问日志
    access_log /var/log/nginx/qyd_access.log;
    error_log /var/log/nginx/qyd_error.log;
    
    # 客户端最大请求体大小
    client_max_body_size 100M;
    
    # 前端静态文件
    location / {
        # 使用变量强制 DNS 重新解析
        set $frontend_upstream qyd_api-frontend-1;
        proxy_pass http://$frontend_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# 后端 API 服务器
server {
    listen 6080;
    server_name 192.168.13.6;
    
    # 访问日志
    access_log /var/log/nginx/qyd_api_access.log;
    error_log /var/log/nginx/qyd_api_error.log;
    
    # 客户端最大请求体大小
    client_max_body_size 100M;
    
    # 后端 API（负载均衡）
    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
