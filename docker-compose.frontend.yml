# 前端服务器专用 Docker Compose 配置
# 用于部署 Frontend (Nginx)

version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
      args:
        # 后端 API 地址（指向后端服务器）
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://192.168.1.20:6080}
        - VITE_APP_TITLE=${VITE_APP_TITLE:-QYD项目管理系统}
    container_name: qyd-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - qyd-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  qyd-network:
    driver: bridge
