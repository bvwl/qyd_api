# 前端分离部署：Vite 构建 + Nginx 静态服务

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    compress: "true"

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://192.168.1.20:6080}"
        VITE_APP_TITLE: "${VITE_APP_TITLE:-QYD项目管理系统}"
    container_name: qyd-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"
    networks:
      - qyd-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    logging: *default-logging

networks:
  qyd-network:
    driver: bridge
