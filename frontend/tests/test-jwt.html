<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 4px;
            border-left: 4px solid #667eea;
            word-break: break-all;
        }
        
        .success {
            border-left-color: #28a745;
            background: #d4edda;
            color: #155724;
        }
        
        .error {
            border-left-color: #dc3545;
            background: #f8d7da;
            color: #721c24;
        }
        
        .info {
            margin-top: 10px;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 4px;
            font-size: 14px;
            color: #004085;
        }
        
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 JWT测试页面</h1>
        
        <!-- 登录测试 -->
        <div class="section">
            <h2>1. 登录测试</h2>
            <div class="form-group">
                <label>账号（邮箱或zhiyu）</label>
                <input type="text" id="email" value="zhiyu" placeholder="输入邮箱或zhiyu">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" value="2201101122@qq.com" placeholder="输入密码">
            </div>
            <button onclick="testLogin()">登录</button>
            <div id="loginResult"></div>
        </div>
        
        <!-- Token信息 -->
        <div class="section">
            <h2>2. Token信息</h2>
            <button onclick="showTokenInfo()">查看Token信息</button>
            <div id="tokenInfo"></div>
        </div>
        
        <!-- API测试 -->
        <div class="section">
            <h2>3. API测试（需要先登录）</h2>
            <button onclick="testApi()">测试获取用户列表</button>
            <div id="apiResult"></div>
        </div>
        
        <!-- 登出测试 -->
        <div class="section">
            <h2>4. 登出测试</h2>
            <button onclick="testLogout()">登出</button>
            <div id="logoutResult"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:6080/api';
        
        // 登录测试
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            try {
                resultDiv.innerHTML = '<div class="info">正在登录...</div>';
                
                const response = await fetch(`${API_BASE_URL}/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // 保存token
                    localStorage.setItem('access_token', data.access_token);
                    
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <strong>✅ 登录成功！</strong><br>
                            用户: ${data.user.nickname} (${data.user.email})<br>
                            角色: ${data.user.roles.map(r => r.name).join(', ')}<br>
                            Token已保存到localStorage
                        </div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <strong>❌ 登录失败</strong><br>
                            ${data.detail || '未知错误'}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ 请求失败</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        // 显示Token信息
        function showTokenInfo() {
            const token = localStorage.getItem('access_token');
            const resultDiv = document.getElementById('tokenInfo');
            
            if (!token) {
                resultDiv.innerHTML = '<div class="result error">未找到Token，请先登录</div>';
                return;
            }
            
            try {
                // 解析JWT token
                const parts = token.split('.');
                const payload = JSON.parse(atob(parts[1]));
                
                // 计算过期时间
                const expTime = new Date(payload.exp * 1000);
                const now = new Date();
                const remainingSeconds = Math.floor((expTime - now) / 1000);
                const remainingMinutes = Math.floor(remainingSeconds / 60);
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        <strong>Token信息</strong><br>
                        用户ID: ${payload.id}<br>
                        邮箱: ${payload.email}<br>
                        角色: ${payload.roles.join(', ')}<br>
                        签发时间: ${new Date(payload.iat * 1000).toLocaleString()}<br>
                        过期时间: ${expTime.toLocaleString()}<br>
                        剩余时间: ${remainingMinutes}分钟 (${remainingSeconds}秒)<br>
                        状态: ${remainingSeconds > 0 ? '✅ 有效' : '❌ 已过期'}
                    </div>
                    <div class="info">
                        <strong>Token (前50字符):</strong><br>
                        ${token.substring(0, 50)}...
                    </div>
                    <pre>${JSON.stringify(payload, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ 解析Token失败</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        // API测试
        async function testApi() {
            const token = localStorage.getItem('access_token');
            const resultDiv = document.getElementById('apiResult');
            
            if (!token) {
                resultDiv.innerHTML = '<div class="result error">未找到Token，请先登录</div>';
                return;
            }
            
            try {
                resultDiv.innerHTML = '<div class="info">正在请求...</div>';
                
                const response = await fetch(`${API_BASE_URL}/v1/user/user?page=1&limit=5`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <strong>✅ API请求成功！</strong><br>
                            获取到 ${data.items?.length || 0} 条用户数据
                        </div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <strong>❌ API请求失败</strong><br>
                            状态码: ${response.status}<br>
                            ${data.detail || '未知错误'}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <strong>❌ 请求失败</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }
        
        // 登出测试
        function testLogout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user-storage');
            
            document.getElementById('logoutResult').innerHTML = `
                <div class="result success">
                    <strong>✅ 已登出</strong><br>
                    Token和用户信息已清除
                </div>
            `;
            
            // 清空其他结果
            document.getElementById('loginResult').innerHTML = '';
            document.getElementById('tokenInfo').innerHTML = '';
            document.getElementById('apiResult').innerHTML = '';
        }
        
        // 页面加载时检查token
        window.onload = function() {
            const token = localStorage.getItem('access_token');
            if (token) {
                showTokenInfo();
            }
        };
    </script>
</body>
</html>
